name: Build D2D Repro

on:
  workflow_dispatch:

jobs:
  windows-repro:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S D2DRepro -B cmake-build
      - name: Build
        run: cmake --build cmake-build --config Release --target D2DRepro
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem -Recurse cmake-build -Filter "D2D Repro.exe" | Copy-Item -Destination dist/
          Get-ChildItem -Recurse dist | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: D2DRepro-windows
          path: dist
